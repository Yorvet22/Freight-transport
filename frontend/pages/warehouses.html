<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Warehouses · FreightFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/css/styles.css">
  <script src="/js/ui.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
</head>
<body data-title="Warehouses">
<main id="app">
  <div class="page-header">
    <div>
      <h2>Warehouses</h2>
      <p>Sites, contacts and daily dock schedule.</p>
    </div>
    <button type="button" class="btn btn-primary" data-action="create" data-requires-role="admin"><i data-lucide="plus" aria-hidden="true"></i>Add warehouse</button>
  </div>

  <div class="card mb-3">
    <form class="toolbar" id="filters" role="search">
      <div class="search-box">
        <i data-lucide="search" aria-hidden="true"></i>
        <input type="search" class="form-control" name="q" placeholder="Search code, name, city…" aria-label="Search warehouses">
      </div>
      <select class="form-select" name="active" aria-label="Filter by state">
        <option value="">Active and inactive</option>
        <option value="true">Active only</option>
        <option value="false">Inactive only</option>
      </select>
      <button type="reset" class="btn-link-ff small text-nowrap">Clear filters</button>
    </form>
    <div class="table-wrap" style="max-height:420px">
      <table class="table" id="warehousesTable">
        <thead>
          <tr>
            <th data-sort="code">Code</th>
            <th data-sort="name">Name</th>
            <th data-sort="city">City</th>
            <th class="hide-lg">Address</th>
            <th class="hide-lg text-end">Capacity</th>
            <th class="hide-lg">Manager</th>
            <th>State</th>
            <th class="text-end"><span class="visually-hidden">Actions</span></th>
          </tr>
        </thead>
        <tbody id="warehousesBody"></tbody>
      </table>
    </div>
    <div class="card-footer" id="pagination"></div>
  </div>

  <!-- Dock schedule -->
  <div class="card" id="schedule">
    <div class="card-header d-flex flex-wrap gap-2 align-items-center justify-content-between">
      <div>
        <h3 class="card-title-sm">Dock schedule</h3>
        <div class="card-subtitle-sm">Departures by pickup window and arrivals by planned delivery date.</div>
      </div>
      <form class="d-flex flex-wrap gap-2" id="scheduleForm">
        <select class="form-select form-select-sm" name="warehouseId" aria-label="Warehouse" style="min-width:200px"></select>
        <div class="input-group input-group-sm" style="width:auto">
          <button type="button" class="btn btn-light" data-action="day" data-delta="-1" aria-label="Previous day"><i data-lucide="chevron-left" aria-hidden="true"></i></button>
          <input type="date" class="form-control" name="date" aria-label="Date">
          <button type="button" class="btn btn-light" data-action="day" data-delta="1" aria-label="Next day"><i data-lucide="chevron-right" aria-hidden="true"></i></button>
        </div>
        <button type="button" class="btn btn-sm btn-light" data-action="today">Today</button>
      </form>
    </div>
    <div class="row g-0">
      <div class="col-12 col-lg-6 border-end-lg">
        <div class="schedule-head">
          <span>Departures</span><span class="badge-soft badge rounded-pill" id="depCount">0</span>
        </div>
        <ul class="schedule-list" id="departures"></ul>
      </div>
      <div class="col-12 col-lg-6">
        <div class="schedule-head">
          <span>Arrivals</span><span class="badge-soft badge rounded-pill" id="arrCount">0</span>
        </div>
        <ul class="schedule-list" id="arrivals"></ul>
      </div>
    </div>
  </div>
</main>

<div class="modal fade" id="warehouseModal" tabindex="-1" aria-labelledby="warehouseModalTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg modal-fullscreen-sm-down">
    <form class="modal-content" id="warehouseForm" novalidate>
      <div class="modal-header">
        <h5 class="modal-title" id="warehouseModalTitle">Add warehouse</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="alert alert-danger small py-2 d-none" data-role="form-alert" role="alert"></div>
        <div class="row g-3">
          <div class="col-sm-4">
            <label class="form-label" for="w-code">Code<span class="req">*</span></label>
            <input class="form-control mono" id="w-code" name="code" maxlength="20" placeholder="WH-05" required>
          </div>
          <div class="col-sm-8">
            <label class="form-label" for="w-name">Name<span class="req">*</span></label>
            <input class="form-control" id="w-name" name="name" maxlength="100" required>
          </div>
          <div class="col-sm-8">
            <label class="form-label" for="w-address">Address<span class="req">*</span></label>
            <input class="form-control" id="w-address" name="address" maxlength="200" required>
          </div>
          <div class="col-sm-4">
            <label class="form-label" for="w-city">City<span class="req">*</span></label>
            <input class="form-control" id="w-city" name="city" maxlength="100" required>
          </div>
          <div class="col-sm-4">
            <label class="form-label" for="w-cap">Capacity</label>
            <div class="input-group">
              <input class="form-control" id="w-cap" name="capacityPallets" type="number" min="0" step="1">
              <span class="input-group-text">pallets</span>
            </div>
          </div>
          <div class="col-sm-4">
            <label class="form-label" for="w-manager">Manager</label>
            <input class="form-control" id="w-manager" name="managerName" maxlength="100">
          </div>
          <div class="col-sm-4">
            <label class="form-label" for="w-phone">Phone</label>
            <input class="form-control" id="w-phone" name="phone" type="tel" maxlength="30">
          </div>
          <div class="col-12">
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" role="switch" id="w-active" name="isActive" checked>
              <label class="form-check-label" for="w-active">Active — available for new orders</label>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary" id="warehouseSaveBtn">Save warehouse</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="/js/list-page.js"></script>
<script src="/js/warehouses.js"></script>
</body>
</html>
