<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Users · FreightFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/css/styles.css">
  <script src="/js/ui.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
</head>
<body data-title="Users">
<main id="app">
  <div class="page-header">
    <div>
      <h2>Users</h2>
      <p>Accounts and roles. Viewers read, dispatchers manage orders and vehicles, admins manage everything.</p>
    </div>
    <button type="button" class="btn btn-primary" data-action="create" data-requires-role="admin"><i data-lucide="plus" aria-hidden="true"></i>Add user</button>
  </div>

  <div class="card" id="usersCard">
    <div class="table-wrap auto">
      <table class="table">
        <thead><tr><th>Username</th><th>Role</th><th class="hide-xs">Created</th><th class="text-end"><span class="visually-hidden">Actions</span></th></tr></thead>
        <tbody id="usersBody"></tbody>
      </table>
    </div>
  </div>
</main>

<div class="modal fade" id="userModal" tabindex="-1" aria-labelledby="userModalTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <form class="modal-content" id="userForm" novalidate>
      <div class="modal-header">
        <h5 class="modal-title" id="userModalTitle">Add user</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="alert alert-danger small py-2 d-none" data-role="form-alert" role="alert"></div>
        <div class="mb-3">
          <label class="form-label" for="u-name">Username<span class="req">*</span></label>
          <input class="form-control" id="u-name" name="username" maxlength="50" autocomplete="off" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="u-pass">Password<span class="req">*</span></label>
          <input class="form-control" id="u-pass" name="password" type="password" autocomplete="new-password" minlength="6" required>
          <div class="form-text">At least 6 characters.</div>
        </div>
        <div>
          <label class="form-label" for="u-role">Role<span class="req">*</span></label>
          <select class="form-select" id="u-role" name="role">
            <option value="viewer">Viewer — read only</option>
            <option value="dispatcher">Dispatcher — orders and vehicles</option>
            <option value="admin">Admin — full access</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary" id="userSaveBtn">Create user</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="/js/users.js"></script>
</body>
</html>
