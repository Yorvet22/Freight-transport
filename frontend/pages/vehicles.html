<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vehicles · FreightFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/css/styles.css">
  <script src="/js/ui.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
</head>
<body data-title="Vehicles">
<main id="app">
  <div class="page-header">
    <div>
      <h2>Vehicles</h2>
      <p>Fleet, drivers and availability.</p>
    </div>
    <button type="button" class="btn btn-primary" data-action="create" data-requires-role="dispatcher"><i data-lucide="plus" aria-hidden="true"></i>Add vehicle</button>
  </div>

  <section class="kpi-grid mb-3" aria-label="Fleet status">
    <div class="card kpi-card"><div class="kpi-label">Total vehicles</div><div class="kpi-value" data-count="total">–</div></div>
    <div class="card kpi-card"><div class="kpi-label">Available</div><div class="kpi-value" data-count="available">–</div></div>
    <div class="card kpi-card"><div class="kpi-label">On trip</div><div class="kpi-value" data-count="on_trip">–</div></div>
    <div class="card kpi-card"><div class="kpi-label">Maintenance</div><div class="kpi-value" data-count="maintenance">–</div></div>
  </section>

  <div class="card">
    <form class="toolbar" id="filters" role="search">
      <div class="search-box">
        <i data-lucide="search" aria-hidden="true"></i>
        <input type="search" class="form-control" name="q" placeholder="Search plate, model, driver…" aria-label="Search vehicles">
      </div>
      <select class="form-select" name="status" aria-label="Filter by status">
        <option value="">All statuses</option>
        <option value="available">Available</option>
        <option value="on_trip">On Trip</option>
        <option value="maintenance">Maintenance</option>
      </select>
      <button type="reset" class="btn-link-ff small text-nowrap">Clear filters</button>
    </form>
    <div class="table-wrap">
      <table class="table" id="vehiclesTable">
        <thead>
          <tr>
            <th data-sort="licensePlate">Plate</th>
            <th data-sort="model">Model</th>
            <th data-sort="driverName">Driver</th>
            <th class="text-end hide-xs">Capacity</th>
            <th data-sort="status">Status</th>
            <th class="text-end"><span class="visually-hidden">Actions</span></th>
          </tr>
        </thead>
        <tbody id="vehiclesBody"></tbody>
      </table>
    </div>
    <div class="card-footer" id="pagination"></div>
  </div>
</main>

<div class="modal fade" id="vehicleModal" tabindex="-1" aria-labelledby="vehicleModalTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-fullscreen-sm-down">
    <form class="modal-content" id="vehicleForm" novalidate>
      <div class="modal-header">
        <h5 class="modal-title" id="vehicleModalTitle">Add vehicle</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="alert alert-danger small py-2 d-none" data-role="form-alert" role="alert"></div>
        <div class="row g-3">
          <div class="col-sm-6">
            <label class="form-label" for="v-plate">License plate<span class="req">*</span></label>
            <input class="form-control mono" id="v-plate" name="licensePlate" maxlength="20" required>
          </div>
          <div class="col-sm-6">
            <label class="form-label" for="v-model">Model<span class="req">*</span></label>
            <input class="form-control" id="v-model" name="model" maxlength="100" required>
          </div>
          <div class="col-sm-6">
            <label class="form-label" for="v-driver">Driver name<span class="req">*</span></label>
            <input class="form-control" id="v-driver" name="driverName" maxlength="100" required>
          </div>
          <div class="col-sm-6">
            <label class="form-label" for="v-cap">Capacity</label>
            <div class="input-group">
              <input class="form-control" id="v-cap" name="capacityKg" type="number" min="1" step="1">
              <span class="input-group-text">kg</span>
            </div>
          </div>
          <div class="col-12">
            <label class="form-label" for="v-status">Status</label>
            <select class="form-select" id="v-status" name="status">
              <option value="available">Available</option>
              <option value="maintenance">Maintenance</option>
            </select>
            <div class="form-text" id="statusHint">On Trip is set automatically when an order is dispatched.</div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary" id="vehicleSaveBtn">Save vehicle</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="/js/list-page.js"></script>
<script src="/js/vehicles.js"></script>
</body>
</html>
