<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · FreightFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/css/styles.css">
  <script src="/js/ui.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
</head>
<body>
<div class="login-page">
  <button type="button" class="btn btn-icon login-theme" data-action="toggle-theme" aria-label="Toggle light/dark theme"></button>

  <div class="card login-card">
    <div class="login-brand">
      <svg class="brand-glyph" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5l5 5-5 5"/><path d="M11 5l5 5-5 5"/></svg>
      <span class="brand-name">FreightFlow</span>
    </div>

    <h1 class="h6 fw-semibold mb-1">Sign in</h1>
    <p class="text-body-secondary small mb-4">Manage orders, fleet and warehouses.</p>

    <form id="loginForm" novalidate>
      <div class="alert alert-danger small py-2 d-none" data-role="form-alert" role="alert"></div>
      <div class="mb-3">
        <label class="form-label" for="username">Username</label>
        <input class="form-control" id="username" name="username" autocomplete="username" required maxlength="50" autofocus>
      </div>
      <div class="mb-4">
        <label class="form-label" for="password">Password</label>
        <div class="input-group">
          <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
          <button class="btn btn-light" type="button" data-action="toggle-password">Show</button>
        </div>
      </div>
      <button class="btn btn-primary w-100" type="submit" id="loginBtn">Sign in</button>
    </form>

    <div class="mt-4 pt-3 border-top">
      <div class="small fw-medium mb-2">Demo accounts</div>
      <table class="demo-table">
        <tbody>
          <tr><td class="text-body-secondary">Admin</td><td><code>admin / admin123</code></td><td class="text-end"><button type="button" class="btn-link-ff small" data-action="fill-demo" data-username="admin" data-password="admin123">Use</button></td></tr>
          <tr><td class="text-body-secondary">Dispatcher</td><td><code>dispatcher / dispatcher123</code></td><td class="text-end"><button type="button" class="btn-link-ff small" data-action="fill-demo" data-username="dispatcher" data-password="dispatcher123">Use</button></td></tr>
          <tr><td class="text-body-secondary">Viewer</td><td><code>viewer / viewer123</code></td><td class="text-end"><button type="button" class="btn-link-ff small" data-action="fill-demo" data-username="viewer" data-password="viewer123">Use</button></td></tr>
        </tbody>
      </table>
      <p class="xsmall text-body-secondary mt-2 mb-0">Demo credentials for evaluation only.</p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
